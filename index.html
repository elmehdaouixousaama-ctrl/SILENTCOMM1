<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Generated | Silent ExE</title>

<style>
:root { --bg:#000; --card:#121212; --text:#fff; --accent:#00ff88; --error:#ff4444; }

body{
background:var(--bg);
color:var(--text);
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
}

.container{max-width:400px;width:100%;text-align:center}
#mainContainer{display:none}
#bypassContainer{display:none}

.card{
background:var(--card);
padding:30px;
border-radius:20px;
margin-top:20px;
}

.key-box{
background:#000;
padding:20px;
border:1px dashed var(--accent);
border-radius:10px;
margin:20px 0;
}

#finalKey{
color:var(--accent);
font-weight:bold;
font-size:18px;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div id="mainContainer">
<h1>Access Unlocked</h1>

<div class="card">
<div class="key-box">
<span id="finalKey">SECURE FETCHING...</span>
</div>

<button class="btn" id="copyBtn" onclick="copyKey()">COPY</button>
</div>
</div>

<div id="bypassContainer">
<h2 style="color:red">ACCESS DENIED</h2>
</div>

</div>

<script>

async function checkSecurity(){
const urlParams = new URLSearchParams(window.location.search);
const source = urlParams.get('source');

if(source === "official"){
document.getElementById('mainContainer').style.display="block";
generateLockedKey();
}else{
document.getElementById('bypassContainer').style.display="block";
}
}

async function generateLockedKey(){
try{

let ip = "127001"; // fallback

try{
const response = await fetch('https://api.ipify.org?format=json');
const data = await response.json();
ip = data.ip.replace(/\./g,'').substring(0,6);
}catch(e){
console.log("API failed → fallback");
}

const day = Math.floor(Date.now()/86400000);
let seed = parseInt(ip)+day+2026;

function rnd(){
var x = Math.sin(seed++)*10000;
return Math.abs(x-Math.floor(x));
}

const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let segments=[];

for(let i=0;i<4;i++){
let s="";
for(let j=0;j<4;j++){
let r=Math.floor(rnd()*chars.length);
s+=chars.charAt(r);
}
segments.push(s);
}

const finalKey="EXE-"+segments.join("-");
document.getElementById('finalKey').innerText=finalKey;

}catch(err){
document.getElementById('finalKey').innerText="ERROR";
}
}

function copyKey(){
const key=document.getElementById('finalKey').innerText;
navigator.clipboard.writeText(key);
}

window.onload=checkSecurity;

</script>

</body>
</html>
